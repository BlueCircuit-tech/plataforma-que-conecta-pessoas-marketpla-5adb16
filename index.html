<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoMentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: {
                            50: '#fdf5ef', 100: '#f9e9d5', 200: '#f3cfaa', 300: '#ecaf76',
                            400: '#e38b42', 500: '#F97316', 600: '#d45a0e', 700: '#b2420d',
                            800: '#8c3712', 900: '#7C2D12', 950: '#4a1a09'
                        },
                        cream: '#FFF7ED',
                        destaque: '#F97316'
                    },
                    fontFamily: {
                        display: ['"DM Serif Display"', 'Georgia', 'serif'],
                        body: ['"Source Sans 3"', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'card': '0 1px 3px rgba(124,45,18,0.08), 0 1px 2px rgba(124,45,18,0.06)',
                        'card-hover': '0 4px 12px rgba(124,45,18,0.12), 0 2px 4px rgba(124,45,18,0.08)',
                        'nav': '0 -2px 12px rgba(124,45,18,0.08)',
                        'fab': '0 4px 14px rgba(249,115,22,0.4)'
                    },
                    borderRadius: {
                        'app': '36px',
                        'card': '14px',
                        'btn': '10px'
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #e8e0d8; overscroll-behavior: none; }
        :focus-visible { outline: 2px solid #F97316; outline-offset: 2px; border-radius: 4px; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4c4b0; border-radius: 3px; }
        .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scroll-hide::-webkit-scrollbar { display: none; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        [data-tela]:not(.hidden) { animation: fadeSlideIn 0.28s ease-out both; }

        .ativo { color: #F97316 !important; }
        .ativo svg { stroke: #F97316 !important; fill: #F97316 !important; }
        .ativo .nav-dot { opacity: 1; transform: scaleX(1); }

        .badge {
            display: inline-flex; align-items: center; padding: 2px 10px;
            border-radius: 999px; font-size: 0.7rem; font-weight: 600;
            letter-spacing: 0.02em; line-height: 1.6;
        }
        .card {
            background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(124,45,18,0.08), 0 1px 2px rgba(124,45,18,0.06);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .card:active { transform: scale(0.985); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 24px; border-radius: 10px; font-weight: 600; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.2s ease; font-family: 'Source Sans 3', sans-serif;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #7C2D12; color: #fff; }
        .btn-primary:hover { background: #5a1f0c; }
        .btn-accent { background: #F97316; color: #fff; }
        .btn-accent:hover { background: #d45a0e; }
        .btn-outline { background: transparent; color: #7C2D12; border: 1.5px solid #7C2D12; }
        .btn-outline:hover { background: #fdf5ef; }

        #app-frame {
            width: 390px; height: 100dvh; max-height: 844px; border-radius: 36px;
            border: 6px solid #1a1a1a; overflow: hidden; position: relative;
            background: #FFF7ED; box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }
        @media (max-width: 430px) {
            #app-frame { width: 100%; max-height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
        }

        #toast-container {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
            pointer-events: none; width: 360px; max-width: calc(100vw - 32px);
        }
        .toast-item {
            pointer-events: auto; padding: 14px 18px; border-radius: 12px;
            color: #fff; font-size: 0.875rem; font-weight: 500; font-family: 'Source Sans 3', sans-serif;
            display: flex; align-items: center; gap: 10px;
            animation: toastIn 0.3s ease-out both; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
        }
        .toast-item.sair { animation: toastOut 0.25s ease-in both; }
        .toast-ok { background: #1a7a3c; }
        .toast-erro { background: #b91c1c; }
        .toast-info { background: #7C2D12; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-16px) scale(0.95); } }

        #modal-overlay {
            position: fixed; inset: 0; background: rgba(28,20,14,0.55); z-index: 8000;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        #modal-overlay.aberto { opacity: 1; pointer-events: auto; }
        #modal-card {
            background: #fff; border-radius: 22px 22px 0 0; width: 390px; max-width: 100%;
            max-height: 75dvh; overflow-y: auto; padding: 0;
            transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @media (max-width: 430px) { #modal-card { width: 100%; } }
        #modal-overlay.aberto #modal-card { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <div id="app-frame">
        <div class="bg-marca-900 flex items-center justify-between px-7 py-2.5 flex-shrink-0 select-none" style="padding-top:max(10px,env(safe-area-inset-top))">
            <span id="clock" class="text-white text-sm font-semibold font-body tracking-wide">12:00</span>
            <div class="flex items-center gap-1.5">
                <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="5" width="3" height="7" rx="0.8" fill="white" opacity="0.4"/><rect x="4.5" y="3.5" width="3" height="8.5" rx="0.8" fill="white" opacity="0.6"/><rect x="9" y="1.5" width="3" height="10.5" rx="0.8" fill="white" opacity="0.8"/><rect x="13.5" y="0" width="3" height="12" rx="0.8" fill="white"/></svg>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0.5" y="0.5" width="13" height="11" rx="2.5" stroke="white" stroke-opacity="0.5" stroke-width="1"/><rect x="2" y="2" width="10" height="8" rx="1" fill="white" opacity="0.9"/><rect x="14" y="4.5" width="1.5" height="3" rx="0.75" fill="white" opacity="0.7"/><rect x="14" y="2.5" width="1.5" height="1" rx="0.4" fill="white" opacity="0.4"/></svg>
            </div>
        </div>

        <main id="main-scroll" class="flex-1 overflow-y-auto scroll-hide bg-cream relative">
            <div id="app-content" class="min-h-full pb-20">
                <!-- TELAS -->
            </div>
        </main>

        <nav class="bg-white flex-shrink-0 border-t border-marca-100/40 px-2 pb-2 pt-1.5" style="box-shadow:0 -2px 12px rgba(124,45,18,0.06);padding-bottom:max(8px,env(safe-area-inset-bottom))">
            <div class="flex justify-around items-center">
                <button data-nav="home" onclick="mostrarTela('home')" class="ativo flex flex-col items-center gap-0.5 py-1 px-2 transition-colors duration-200 text-marca-300">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="text-[10px] font-semibold font-body">Home</span>
                    <div class="nav-dot w-1 h-1 rounded-full bg-marca-500 opacity-0 scale-x-0 transition-all duration-200"></div>
                </button>
                <button data-nav="cursos" onclick="mostrarTela('cursos')" class="flex flex-col items-center gap-0.5 py-1 px-2 transition-colors duration-200 text-marca-300">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span class="text-[10px] font-semibold font-body">Cursos</span>
                    <div class="nav-dot w-1 h-1 rounded-full bg-marca-500 opacity-0 scale-x-0 transition-all duration-200"></div>
                </button>
                <button data-nav="oportunidades" onclick="mostrarTela('oportunidades')" class="flex flex-col items-center gap-0.5 py-1 px-2 transition-colors duration-200 text-marca-300">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                    <span class="text-[10px] font-semibold font-body">Vagas</span>
                    <div class="nav-dot w-1 h-1 rounded-full bg-marca-500 opacity-0 scale-x-0 transition-all duration-200"></div>
                </button>
                <button data-nav="oficinas" onclick="mostrarTela('oficinas')" class="flex flex-col items-center gap-0.5 py-1 px-2 transition-colors duration-200 text-marca-300">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    <span class="text-[10px] font-semibold font-body">Oficinas</span>
                    <div class="nav-dot w-1 h-1 rounded-full bg-marca-500 opacity-0 scale-x-0 transition-all duration-200"></div>
                </button>
                <button data-nav="minha-conta" onclick="mostrarTela('minha-conta')" class="flex flex-col items-center gap-0.5 py-1 px-2 transition-colors duration-200 text-marca-300">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="text-[10px] font-semibold font-body">Conta</span>
                    <div class="nav-dot w-1 h-1 rounded-full bg-marca-500 opacity-0 scale-x-0 transition-all duration-200"></div>
                </button>
            </div>
        </nav>
    </div>

    <div id="toast-container"></div>

    <div id="modal-overlay" onclick="if(event.target===this)fecharModal()">
        <div id="modal-card">
            <div class="sticky top-0 bg-white/90 backdrop-blur-sm px-5 pt-5 pb-3 flex items-center justify-between border-b border-marca-100/40 rounded-t-[22px]">
                <h3 id="modal-titulo" class="font-display text-lg text-marca-900"></h3>
                <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-marca-50 text-marca-800 hover:bg-marca-100 transition-colors">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="modal-conteudo" class="p-5"></div>
        </div>
    </div>

    <script>
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function (s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function (b) {
                b.classList.toggle('ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0 });
        }
        document.addEventListener('DOMContentLoaded', function () {
            mostrarTela('home');
        });

        function toast(mensagem, tipo) {
            var container = document.getElementById('toast-container');
            var el = document.createElement('div');
            var icones = { ok: '✓', erro: '✕', info: 'ℹ' };
            el.className = 'toast-item toast-' + (tipo || 'info');
            el.innerHTML = '<span class="text-base leading-none">' + (icones[tipo] || 'ℹ') + '</span><span>' + mensagem + '</span>';
            container.appendChild(el);
            setTimeout(function () {
                el.classList.add('sair');
                setTimeout(function () { el.remove(); }, 250);
            }, 3000);
        }

        function abrirModal(html, titulo) {
            document.getElementById('modal-conteudo').innerHTML = html;
            document.getElementById('modal-titulo').textContent = titulo || '';
            var ov = document.getElementById('modal-overlay');
            ov.classList.add('aberto');
            document.body.style.overflow = 'hidden';
        }
        function fecharModal() {
            var ov = document.getElementById('modal-overlay');
            ov.classList.remove('aberto');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') fecharModal();
        });

        function brl(valor) {
            return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function dataBR(iso) {
            var d = new Date(iso + 'T00:00:00');
            var dd = String(d.getDate()).padStart(2, '0');
            var mm = String(d.getMonth() + 1).padStart(2, '0');
            var yyyy = d.getFullYear();
            return dd + '/' + mm + '/' + yyyy;
        }

        (function () {
            function atualizarRelogio() {
                var agora = new Date();
                var h = String(agora.getHours()).padStart(2, '0');
                var m = String(agora.getMinutes()).padStart(2, '0');
                var el = document.getElementById('clock');
                if (el) el.textContent = h + ':' + m;
            }
            atualizarRelogio();
            setInterval(atualizarRelogio, 30000);
        })();
    </script>
</body>
</html>
